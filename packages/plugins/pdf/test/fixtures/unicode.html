<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>fixture: unicode</title>
<script type="importmap">
{ "imports": { "@zumer/snapdom": "/snapdom/dist/snapdom.mjs" } }
</script>
<style>
  body { margin: 0; padding: 24px; background: #eef1f5; }
  #target { width: 620px; background: #fff; padding: 24px; color: #111;
            font: 20px/1.5 Arial, Helvetica, sans-serif; }
  p { margin: 0 0 8px; }
</style>
</head>
<body>
<div id="target">
  <p>Curly “quotes” and em—dash, café naïve.</p>
  <p lang="zh"><span data-probe="cjk">中文测试段落</span></p>
  <p lang="ru">Русский текст</p>
  <p lang="el">Ελληνικά κείμενα</p>
  <!-- RTL is the one case where "origin = rect.left" is a decision and not a
       tautology: the glyphs run right-to-left from what is visually their end. -->
  <p lang="ar" dir="rtl"><span data-probe="arabic">العربية</span></p>
  <p lang="he" dir="rtl">עברית</p>
  <p>Emoji 😀 and 🚀 fly.</p>
  <!-- One word straddling both encodings: the whole run has to leave WinAnsi. -->
  <p><span data-probe="mixed">Mixed中文Latin</span></p>
</div>
<script type="module">
  import './_pdf.js'
  window.__ready = true
</script>
</body>
</html>
