<style>
  body { margin: 0; padding: 24px; background: #eef1f5; }
  #target { width: 600px; background: #fff; padding: 24px; color: #111;
            font: 16px/1.6 Arial, Helvetica, sans-serif; }
  p { margin: 0; }
</style>

<body>
<!-- The ONLY configuration in which paginate is forced to cut through a line of
     text: one paragraph, taller than maxLeaf so it is not atomic, taller than a
     page so every cut has to land inside it, and nothing else on the page to
     provide a legal boundary. Every word is unique, so "lost from both pages"
     (limitation 2) shows up as a missing token rather than as a shorter string. -->
<div id="target"><p data-probe="prose"></p></div>
<script type="module">
  import './_pdf.js'

  window.__words = Array.from({ length: 1000 }, (_, i) => `W${String(i).padStart(3, '0')}`)
  document.querySelector('#target p').textContent = window.__words.join(' ')
  window.__ready = true
</script>
</body>
