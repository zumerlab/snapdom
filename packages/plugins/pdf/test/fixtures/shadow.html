<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>fixture: shadow</title>
<script type="importmap">
{ "imports": { "@zumer/snapdom": "/snapdom/dist/snapdom.mjs" } }
</script>
<style>
  body { margin: 0; padding: 24px; background: #eef1f5; }
  #target { width: 520px; background: #fff; padding: 24px; color: #111;
            font: 18px/1.5 Arial, Helvetica, sans-serif; }
  p { margin: 0 0 10px; }
</style>
</head>
<body>
<div id="target">
  <p>LIGHTOUTSIDE</p>
  <!-- SLOTTEDTITLE lives in the light DOM but paints inside the shadow tree: a walker
       that follows both must still emit it exactly once. -->
  <my-card><span slot="title">SLOTTEDTITLE</span></my-card>
</div>
<script type="module">
  import './_pdf.js'

  class InnerBox extends HTMLElement {
    connectedCallback() {
      this.attachShadow({ mode: 'open' }).innerHTML =
        '<style>p{margin:0;font:18px/1.5 Arial,Helvetica,sans-serif}</style><p>NESTEDSHADOWTEXT</p>'
    }
  }
  class MyCard extends HTMLElement {
    connectedCallback() {
      this.attachShadow({ mode: 'open' }).innerHTML = `
        <style>
          .card { border: 1px solid #cbd5e1; border-radius: 8px; padding: 14px;
                  font: 18px/1.5 Arial, Helvetica, sans-serif; color: #111; }
          h2 { font-size: 20px; margin: 0 0 8px; }
          input { display: block; margin: 10px 0; width: 240px; padding: 6px 8px;
                  font: 16px/1.4 Arial, Helvetica, sans-serif; border: 1px solid #cbd5e1;
                  border-radius: 6px; box-sizing: border-box; }
        </style>
        <div class="card">
          <h2>SHADOWHEADING</h2>
          <slot name="title"></slot>
          <input type="text" value="SHADOWINPUTVALUE">
          <inner-box></inner-box>
        </div>`
    }
  }
  customElements.define('inner-box', InnerBox)
  customElements.define('my-card', MyCard)

  requestAnimationFrame(() => { window.__ready = true })
</script>
</body>
</html>
