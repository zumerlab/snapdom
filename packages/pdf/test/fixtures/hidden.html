<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>fixture: hidden</title>
<script type="importmap">
{ "imports": { "@zumer/snapdom": "/snapdom/dist/snapdom.mjs" } }
</script>
<style>
  body { margin: 0; padding: 24px; background: #eef1f5; }
  #target { width: 520px; background: #fff; padding: 24px; color: #111;
            font: 18px/1.5 Arial, Helvetica, sans-serif; }
  p { margin: 0 0 8px; }
</style>
</head>
<body>
<div id="target">
  <p>VISIBLEBASELINE</p>

  <!-- opacity:0 two levels up: nothing under here reaches a pixel. -->
  <div style="opacity:0"><div><p><span>OPACITYZEROTEXT</span></p></div></div>

  <!-- visibility is inherited but revocable, so the exception has to survive. -->
  <div style="visibility:hidden">
    <div><p><span>VISHIDDENTEXT</span></p></div>
    <p style="visibility:visible">VISVISIBLEINSIDE</p>
  </div>

  <!-- 0.02 still paints; only an exact 0 is invisible. -->
  <div style="opacity:0.02"><p>LOWOPACITYTEXT</p></div>

  <p style="display:none">DISPLAYNONETEXT</p>
</div>
<script type="module">
  import './_pdf.js'
  window.__ready = true
</script>
</body>
</html>
