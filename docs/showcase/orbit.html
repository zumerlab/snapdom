<!doctype html>
<html lang="en" data-standalone-fixture>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Orbit capture demo</title>
<!-- Framed by the showcase. Orbit's stylesheet uses :has(), and a :has() rule anywhere in a
     document makes every mutation in it invalidate every memoized capture, so it lives in its
     own document instead of the showcase's. -->
<link rel="stylesheet" href="https://unpkg.com/@zumer/orbit/dist/orbit.min.css" crossorigin="anonymous">
<style>
html, body { margin: 0; height: 100%; background: black; }
#orbit-box { box-sizing: border-box; height: 100%; overflow: hidden; padding: 1.5em; border: 1px solid #0F1E4D; background: black; color: rgba(255, 255, 255, 0.451); font-family: sans-serif; font-optical-sizing: auto; }
@media (max-width: 600px) { #orbit-box { padding: 1em; font-size: 0.8em; } }
.container-gyro {
  background: black;
}


.gyro {
  transform-style: preserve-3d;
  perspective: 300px;
}

.z-15 {
  transform: translateZ(-15px);
}

.z-35 {
  transform: translateZ(-35px);
}

.z-75 {
  transform: translateZ(-75px);
}

.z-85 {
  transform: translateZ(-85px);
}

.z-110 {
  transform: translateZ(-110px);
}

.z-120 {
  transform: translateZ(-120px);
}

.z-155 {
  transform: translateZ(-155px);
}

.cyan {
  --o-fill: var(--o-cyan)
}

.cyan-light {
  --o-fill: var(--o-cyan-light)
}

.cyan-dark-transparent {
  --o-fill: var(--o-cyan-dark);
  opacity: 0.6
}

.pink {
  --o-fill: var(--o-pink)
}

.transparent {
  --o-fill: none
}

.white {
  color: white
}

.dashed-small {
  opacity: 0.5;
  height: 3px;
  background: var(--o-cyan-darker);
}

.dashed-big {
  opacity: 0.8;
  height: 6px;
  background: var(--o-cyan);

}

.gyro {
  animation: tiltLoop 10s ease-in-out 5 alternate;
}

@keyframes tiltLoop {
  0% {
    transform: rotateX(-35deg) rotateY(-35deg);
  }

  25% {
    transform: rotateX(-35deg) rotateY(35deg);
  }

  50% {
    transform: rotateX(35deg) rotateY(35deg);
  }

  75% {
    transform: rotateX(35deg) rotateY(-35deg);
  }

  100% {
    transform: rotateX(-35deg) rotateY(-35deg);
  }
}
</style>
</head>
<body>
<div id="orbit-box">
  <div class="bigbang container-gyro">
    <div class="gravity-spot gyro">
      <div class="orbit-6 from-120 range-240 small-dash z-15">
        <!-- small dash elements -->
      </div>
      <div class="orbit-6 z-35">
        <o-arc value="25" class="from-215 shrink-70 outer-orbit pink"></o-arc>
      </div>
      <div class="orbit-5">
        <o-arc value="25" class="from-315 shrink-80 inner-orbit cyan-light"></o-arc>
      </div>
      <div class="orbit-5 from-48 range-130">
        <o-arc class=" shrink-40 outer-orbit cyan-dark-transparent"></o-arc>
      </div>
      <div class="orbit-5 from-180 range-100 big-dash">
        <!-- small dash elements -->
      </div>
      <div class="orbit-4 z-85">
        <o-arc value="40" class="from-10 shrink-40 pink"></o-arc>
      </div>
      <div class="orbit-6 from-320 z-110">
        <o-arc value="40" class="shrink-40 cyan-light"></o-arc>
      </div>
      <div class="orbit-6  from-30 z-120">
        <o-arc class="shrink-60 cyan-light"></o-arc>
        <o-arc class="shrink-60 transparent"></o-arc>
        <o-arc class="shrink-60 cyan-light"></o-arc>
        <o-arc class="shrink-60 transparent"></o-arc>
      </div>
      <div class="orbit-6  from-100 z-155">
        <o-arc value="40" class="shrink-90 inner-orbit cyan-light"></o-arc>
      </div>
      <div class="orbit-6 from-185 range-80 z-75">
        <o-arc class="grow-0.5x cyan-dark-transparent"></o-arc>
      </div>
      <div class="orbit-0 white">ORBIT</div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/@zumer/orbit/dist/orbit.min.js" crossorigin></script>
<script>
  const container = document.querySelector('.container-gyro');
  const gyro = document.querySelector('.gyro');
  const sd = document.querySelector('.small-dash')
  const bd = document.querySelector('.big-dash')

  const smallDashs = [];
  const bigDashs = [];

  for (let i = 0; i < 30; i++) {
    smallDashs.push("<div class='vector shrink-40 outer-orbit dashed-small'></div>");
  }

  for (let i = 0; i < 15; i++) {
    bigDashs.push("<div class='vector shrink-40 outer-orbit dashed-big'></div>");
  }

  sd.innerHTML = smallDashs.join('');
  bd.innerHTML = bigDashs.join('');
</script>
<script type="module">
// The showcase's Capture and Download buttons call this document's own snapdom.
import { snapdom } from 'https://unpkg.com/@zumer/snapdom@latest/dist/snapdom.mjs'
window.orbitSnap = { snapdom, box: document.getElementById('orbit-box') }
</script>
</body>
</html>
