<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="486" height="526.1875" viewBox="0 0 486 526.1875" text-rendering="geometricPrecision">
  <!-- snapdom-vector svg-flat: 16 approximation(s) — nothing here is silent.
    · [n_0] a drop shadow with -18px spread is emitted with feMorphology; the spread corners are approximated by a rectangular kernel.
    · [n_0] a drop shadow with 1px spread is emitted with feMorphology; the spread corners are approximated by a rectangular kernel.
    · [n_0] the box-shadow on this node (2 outer, 0 inner) is emitted as feMorphology + feGaussianBlur + feOffset + feFlood + feComposite + feMerge + feMergeNode, of which only the feGaussianBlur maps onto an effect an importer of Figma's class has, so the whole <filter> is dropped there.
    · a filter this document emits will not be executed by the destination it is written for. Figma maps feDropShadow and feGaussianBlur onto effects of its own and ignores any filter it cannot map — measured by pasting (2026-08-06, FIGMA_FINDINGS §7): a lone feColorMatrix, with nothing composite around it, arrived WITH ITS NODE and with no colour change at all. That covers the colour functions of filter/backdrop-filter (saturate, brightness, contrast, grayscale, sepia, hue-rotate, invert), which compose into one feColorMatrix, and inner shadows, which have no primitive at all. What gets ignored is the <filter> ELEMENT and not the primitive, so anything else in the same chain — a blur beside a colour matrix — goes with it. What is lost is the EFFECT and not the node: it arrives whole — every fill, stroke, glyph and child of it — and lands unfiltered. That is the opposite of the <pattern> failure, where the node itself never arrives. In a browser this filter renders exactly what CSS specifies. exactShadows:false — the default — emits the outer shadows as feDropShadow primitives, which do arrive. rasterFilters:true rasterizes exactly the nodes whose filter does not survive — and only those — to a PNG <image>, the one degraded form the paste probe proves Figma draws, at the cost of the subtree's editability.
    · one of those filters carries a feFlood, and a flood has been measured landing two different ways: the exact box-shadow chain (FIGMA_FINDINGS §4) arrived as a flat rectangle of the shadow colour — Figma kept the flood and lost the feComposite that cuts it down to the silhouette — while the inner-shadow chain of the six-shape probe arrived with nothing painted at all. Which of the two a given chain gets is not predictable from here, and the rectangle is the worse one: it covers the design instead of leaving it plain.
    · [n_1] a linear background is clipped to this element's glyphs (background-clip: text). It is moved onto the glyphs themselves — as the fill of the <text> when it is a flat colour, and, when it is a gradient, through a mask of the same text (emit.svg.text-gradient-mask says what that costs). The paint keeps the ELEMENT as its reference box, which is the box CSS measured it against — not the glyph bounding box, and not the box of whatever shape ends up carrying it.
    · no font binary travels with this SVG, so no line carries textLength and every line's width is the viewer's to decide. Pinning a substituted family to the advances the page's font measured does not degrade gracefully — it squeezes the glyphs into the measured width (verified by pasting into Figma), so the measurement is stated by position only.
    · [n_2] this text is painted with a gradient and is emitted as <text fill="url(#…)"> — one editable, selectable, searchable text element, which is plain SVG 1.1 and what every conformant renderer resolves. Measured in Chromium against the <mask> form: pixel-identical. The exception is FIGMA's SVG importer, which does not resolve the reference and paints the block BLACK; for that destination use `textGradientMask: true` (the colours, at the cost of the text layer) or the h2d channel, which keeps both. The mask was the default until 2026-08-07 and was flipped because a renderer without <mask> support paints its rect UNMASKED and the text disappears entirely.
    · [n_5] a wavy underline is emitted as a <path>: 11px wavelength, 4.25px peak to peak, 2px stroke — the geometry Chromium paints for that thickness, measured off its raster. It sits 5.4px below the baseline: the measured `auto` position, plus this run's text-underline-offset of 4px. What stays assumed is the PHASE — the wave starts on a crest at the left end of the run, and CSS says nothing about where Chromium starts its own.
    · [n_6] 4 line(s) of this block end in a hyphen the browser painted at a hyphenation break and the document does not contain (`collect.text-hyphen` measured it and put it on `line.hyphen`, not in `characters`, which every offset indexes). It is appended here to the piece that ends the line — U+2010 — inside the last tspan so no importer can drop it separately from the text. Its advance was already inside the measured line width, so nothing else moves. What this costs is that the emitted string is no longer character-for-character the page's `textContent`: a consumer that reflows this text (Figma reflows a TextNode) will keep the hyphen in the middle of a word.
    · [n_6] a text block that occupies 5 positioned pieces is emitted as 5 <text> elements, one per piece at its own measured baseline. An importer that ignores the x/y of an interior tspan (Figma) reflows a single <text> with its own leading and stacks the lines on top of each other. The glyphs land where they were measured; what is lost is the block — each line arrives as its own text layer, editable on its own. textPerLine:"never" keeps one <text> per block.
    · [n_7] a line whose runs leave the baseline (superscript, subscript, vertical-align) is emitted as 10 positioned pieces — each at the x its own characters were measured at and at its own absolute baseline — instead of one piece with relative `dy` shifts. SVG `dy` is cumulative, so every raised run has to be paid back by the next one, and an importer that carries only part of that chain drifts the rest of the line (measured by pasting into Figma). What is lost is the line as one object: it arrives as 10 text layers, each editable on its own.
    · [n_7] a text block that occupies 11 positioned pieces is emitted as 11 <text> elements, one per piece at its own measured baseline. An importer that ignores the x/y of an interior tspan (Figma) reflows a single <text> with its own leading and stacks the lines on top of each other. The glyphs land where they were measured; what is lost is the block — each line arrives as its own text layer, editable on its own. textPerLine:"never" keeps one <text> per block.
    · [n_8] per-side border weights on a rounded box: the sides are emitted as square-mitered quads clipped to the border radius, so the corner arcs thin out where the miter is cut away.
    · [n_9] a text block that occupies 2 positioned pieces is emitted as 2 <text> elements, one per piece at its own measured baseline. An importer that ignores the x/y of an interior tspan (Figma) reflows a single <text> with its own leading and stacks the lines on top of each other. The glyphs land where they were measured; what is lost is the block — each line arrives as its own text layer, editable on its own. textPerLine:"never" keeps one <text> per block.
    · [n_10] a text block that occupies 2 positioned pieces is emitted as 2 <text> elements, one per piece at its own measured baseline. An importer that ignores the x/y of an interior tspan (Figma) reflows a single <text> with its own leading and stacks the lines on top of each other. The glyphs land where they were measured; what is lost is the block — each line arrives as its own text layer, editable on its own. textPerLine:"never" keeps one <text> per block.
  -->
