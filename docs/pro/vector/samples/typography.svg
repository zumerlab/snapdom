      <text xml:space="preserve" font-family="-apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="13.5" fill="#334155" x="0" y="15">El texto justificado reparte el sobrante entre los espacios de cada lí‐</text><text xml:space="preserve" font-family="-apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="13.5" fill="#334155" x="0" y="36.8594"><tspan font-family="-apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="13.5" fill="#334155">nea, así que </tspan><tspan font-family="-apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">ninguna palabra empieza donde el navegador la deja‐</tspan></text><text xml:space="preserve" font-family="-apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="13.5" fill="#334155" x="0" y="58.7188"><tspan font-family="-apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">ría</tspan><tspan font-family="-apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="13.5" fill="#334155"> con un alineado normal. Si el motor mide la línea y no los frag‐</tspan></text><text xml:space="preserve" font-family="-apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="13.5" fill="#334155" x="0" y="80.5781">mentos, aquí se nota antes que en ningún otro sitio, porque cada lí‐</text><text xml:space="preserve" font-family="-apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="13.5" fill="#334155" x="0" y="102.4375">nea miente de una forma distinta.</text>
