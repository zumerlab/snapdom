<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="452" height="556.7344" viewBox="0 0 452 556.7344" text-rendering="geometricPrecision">
  <!-- snapdom-vector svg-flat: 16 approximation(s) — nothing here is silent.
    · [n_0] a drop shadow with -18px spread is emitted with feMorphology; the spread corners are approximated by a rectangular kernel.
    · [n_0] a drop shadow with 1px spread is emitted with feMorphology; the spread corners are approximated by a rectangular kernel.
    · [n_0] the box-shadow on this node (2 outer, 0 inner) is emitted as feMorphology + feGaussianBlur + feOffset + feFlood + feComposite + feMerge + feMergeNode, of which only the feGaussianBlur maps onto an effect an importer of Figma's class has, so the whole <filter> is dropped there.
    · a filter this document emits will not be executed by the destination it is written for. Figma maps feDropShadow and feGaussianBlur onto effects of its own and ignores any filter it cannot map — measured by pasting (2026-08-06, FIGMA_FINDINGS §7): a lone feColorMatrix, with nothing composite around it, arrived WITH ITS NODE and with no colour change at all. That covers the colour functions of filter/backdrop-filter (saturate, brightness, contrast, grayscale, sepia, hue-rotate, invert), which compose into one feColorMatrix, and inner shadows, which have no primitive at all. What gets ignored is the <filter> ELEMENT and not the primitive, so anything else in the same chain — a blur beside a colour matrix — goes with it. What is lost is the EFFECT and not the node: it arrives whole — every fill, stroke, glyph and child of it — and lands unfiltered. That is the opposite of the <pattern> failure, where the node itself never arrives. In a browser this filter renders exactly what CSS specifies. exactShadows:false — the default — emits the outer shadows as feDropShadow primitives, which do arrive. rasterFilters:true rasterizes exactly the nodes whose filter does not survive — and only those — to a PNG <image>, the one degraded form the paste probe proves Figma draws, at the cost of the subtree's editability.
    · one of those filters carries a feFlood, and a flood has been measured landing two different ways: the exact box-shadow chain (FIGMA_FINDINGS §4) arrived as a flat rectangle of the shadow colour — Figma kept the flood and lost the feComposite that cuts it down to the silhouette — while the inner-shadow chain of the six-shape probe arrived with nothing painted at all. Which of the two a given chain gets is not predictable from here, and the rectangle is the worse one: it covers the design instead of leaving it plain.
    · no font binary travels with this SVG, so no line carries textLength and every line's width is the viewer's to decide. Pinning a substituted family to the advances the page's font measured does not degrade gracefully — it squeezes the glyphs into the measured width (verified by pasting into Figma), so the measurement is stated by position only.
    · [n_2] a text block that occupies 2 positioned pieces is emitted as 2 <text> elements, one per piece at its own measured baseline. An importer that ignores the x/y of an interior tspan (Figma) reflows a single <text> with its own leading and stacks the lines on top of each other. The glyphs land where they were measured; what is lost is the block — each line arrives as its own text layer, editable on its own. textPerLine:"never" keeps one <text> per block.
    · [n_12] the select widget is drawn from primitives at Chromium's measured proportions — it is a reconstruction from the element's type, state and accent-color, not a capture of the widget the platform paints, and another engine or theme draws it differently.
    · [n_16] the checkbox widget is drawn from primitives at Chromium's measured proportions — it is a reconstruction from the element's type, state and accent-color, not a capture of the widget the platform paints, and another engine or theme draws it differently.
    · [n_19] the checkbox widget is drawn from primitives at Chromium's measured proportions — it is a reconstruction from the element's type, state and accent-color, not a capture of the widget the platform paints, and another engine or theme draws it differently.
    · [n_22] the checkbox widget is drawn from primitives at Chromium's measured proportions — it is a reconstruction from the element's type, state and accent-color, not a capture of the widget the platform paints, and another engine or theme draws it differently.
    · [n_27] the radio widget is drawn from primitives at Chromium's measured proportions — it is a reconstruction from the element's type, state and accent-color, not a capture of the widget the platform paints, and another engine or theme draws it differently.
    · [n_30] the radio widget is drawn from primitives at Chromium's measured proportions — it is a reconstruction from the element's type, state and accent-color, not a capture of the widget the platform paints, and another engine or theme draws it differently.
    · [n_33] the radio widget is drawn from primitives at Chromium's measured proportions — it is a reconstruction from the element's type, state and accent-color, not a capture of the widget the platform paints, and another engine or theme draws it differently.
    · [n_37] the range widget is drawn from primitives at Chromium's measured proportions — it is a reconstruction from the element's type, state and accent-color, not a capture of the widget the platform paints, and another engine or theme draws it differently.
    · [n_39] the progress widget is drawn from primitives at Chromium's measured proportions — it is a reconstruction from the element's type, state and accent-color, not a capture of the widget the platform paints, and another engine or theme draws it differently.
  -->
