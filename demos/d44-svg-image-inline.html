<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>#341 SVG image href inline</title>
  </head>
  <body>
    <h3>#341: SVG &lt;image href="https://..."&gt; should be inlined</h3>
    <p>Same scenario as Highcharts: external image inside SVG.</p>

    <div id="target" style="border: 1px solid #ccc; padding: 8px;">
      <svg width="200" height="120" xmlns="http://www.w3.org/2000/svg">
        <image href="https://placehold.co/150x100/eee/333?text=SVG+Image" x="10" y="10" width="150" height="100" />
      </svg>
    </div>

    <button id="capture">snapdom capture</button>
    <h4>Result:</h4>
    <div id="out"></div>
  </body>
  <script type="module">
    import { snapdom } from '../dist/snapdom.mjs';

    document.getElementById('capture').addEventListener('click', async () => {
      const out = document.getElementById('out');
      out.innerHTML = '';
      try {
        const el = document.getElementById('target');
        const result = await snapdom(el);
        const img = await result.toPng();
        out.appendChild(img);
      } catch (e) {
        out.innerHTML = '<span style="color:red">' + e.message + '</span>';
      }
    });
  </script>
</html>
