<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      /* #426: container with no border/padding; first child has margin-top.
         The child's margin collapses through the parent, so the parent box
         is offset/short and snapdom clips the bottom. */
      .box {
        width: 320px;
        background: #f3f4f6;
      }
      .child {
        margin-top: 40px;
        height: 80px;
        background: #34d399;
        color: #064e3b;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
      }
      .last {
        margin-bottom: 30px;
        height: 40px;
        background: #60a5fa;
        color: #1e3a8a;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div id="target" class="box">
      <div class="child">first child has margin-top: 40px</div>
      <div class="last">last child has margin-bottom: 30px</div>
    </div>
  </body>
</html>
