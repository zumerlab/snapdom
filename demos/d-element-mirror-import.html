<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>element-mirror import — visual demo</title>
<style>
  body { font: 14px Arial, Helvetica, sans-serif; margin: 0; background: #f5f5f7; }
  #target { width: 900px; padding: 24px; background: #fff; display: grid; gap: 24px;
            grid-template-columns: 1fr 1fr; }
  .panel { border: 1px solid #d8d8de; border-radius: 10px; padding: 16px; background: #fff; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
              color: #6b6b76; margin: 0 0 12px; }
  /* 1. selection */
  #sel-authored::selection { background: rgb(255, 0, 102); color: #fff; }
  #sel-field::selection { background: rgb(255, 0, 102); color: #fff; }
  .sel-line { margin: 0 0 10px; font-size: 15px; }
  #sel-field { font: 15px Arial; width: 100%; box-sizing: border-box; padding: 6px 8px;
               border: 1px solid #c9c9d1; border-radius: 6px; }
  /* 2. subtree bleed: the ring belongs to the CHILD, drawn against the root's edge */
  .bleed-host { width: 220px; height: 64px; }
  .bleed-child { width: 220px; height: 64px; border-radius: 8px; background: #eef2ff;
                 box-shadow: 0 0 0 6px rgb(99, 102, 241); }
  /* 3. native controls */
  .controls { display: grid; gap: 12px; }
  .controls input[type=range] { accent-color: rgb(255, 0, 102); width: 220px; }
  /* 4. gradient text (background-clip: text) */
  .gradient-text { font: bold 34px Arial; background-image: linear-gradient(90deg, rgb(255,0,102), rgb(0,102,255));
                   -webkit-background-clip: text; background-clip: text; color: transparent;
                   -webkit-text-fill-color: transparent; }
</style>
</head>
<body>
<div id="target">
  <section class="panel">
    <h2>1 · captureSelection</h2>
    <p class="sel-line" id="sel-ua">A run highlighted with the UA colour.</p>
    <p class="sel-line" id="sel-authored">A run with an authored ::selection rule.</p>
    <input id="sel-field" value="An unfocused field paints no highlight">
  </section>

  <section class="panel">
    <h2>2 · outerShadows: 'subtree'</h2>
    <div class="bleed-host"><div class="bleed-child"></div></div>
  </section>

  <section class="panel">
    <h2>3 · native controls</h2>
    <div class="controls">
      <input type="range" min="0" max="100" value="70">
      <input type="color" value="#ff0066">
      <input type="date" value="2026-08-29">
      <label><input type="checkbox" checked> checkbox</label>
    </div>
  </section>

  <section class="panel">
    <h2>4 · background-clip: text</h2>
    <div class="gradient-text">Gradient text</div>
  </section>
</div>

<script>
  // The selection is paint state, so the demo puts it there: two document ranges plus a
  // focused field selection. The visual suite calls this through its `setup` override.
  window.__selectDemo = () => {
    const ua = document.getElementById('sel-ua').firstChild
    const authored = document.getElementById('sel-authored').firstChild
    const selection = window.getSelection()
    selection.removeAllRanges()
    // ONE range spanning both paragraphs: Blink and WebKit keep a single range per selection,
    // so two addRange calls would silently drop the second. Each element's own ::selection
    // rule still applies to its own run, which is the case worth showing.
    const range = document.createRange()
    range.setStart(ua, 2)
    range.setEnd(authored, 26)
    selection.addRange(range)
    // Not both at once, by the platform's own rules: focusing a field collapses the document
    // selection. The field's own highlight is covered by the unit and raster tests; this demo
    // shows the two document runs, which is the case a screenshot most often has to carry.
  }
  window.__selectDemo()
</script>
</body>
</html>
