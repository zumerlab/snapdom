<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; padding: 16px; background: #fff; }
      #target { display: flex; gap: 12px; align-items: flex-start; }
      .col { width: 120px; }
      .cap { font-size: 11px; line-height: 14px; height: 28px; color: #333; }

      /* visibility is INHERITED but a descendant can opt back in and still paint.
         Flattening a hidden ancestor to opacity:0 made that descendant impossible
         to recover: nothing below it could ever paint again. */
      .vis-host { width: 120px; height: 120px; visibility: hidden; background: #ffd400; }
      .vis-mid { width: 120px; height: 120px; background: #0aa; }
      .vis-on { visibility: visible; background: #d21; }
      .vis-band { width: 120px; height: 40px; }
      .vis-off { visibility: hidden; background: #0aa; }

      /* content-visibility:hidden paints the element's OWN box (background, border,
         padding) and skips its contents outright. A descendant's visibility:visible
         does not bring them back, and the box must not be erased either. */
      .cv-hidden { content-visibility: hidden; }
      .cv-auto { content-visibility: auto; }
      .cv-box {
        width: 120px; box-sizing: border-box;
        padding: 14px; border: 4px solid #2F63FF; background: #ffd400;
      }
      .cv-fill { height: 60px; background: #d21; }
    </style>
  </head>
  <body>
    <div id="target">
      <!-- 1: hidden ancestor, descendant restores visibility -> red band paints,
           the re-hidden grandchild band does not. -->
      <div class="col">
        <div class="cap">visibility: hidden host, child restores</div>
        <div class="vis-host">
          <div class="vis-mid">
            <div class="vis-band vis-on"></div>
            <div class="vis-band vis-off"></div>
            <div class="vis-band vis-on"></div>
          </div>
        </div>
      </div>

      <!-- 2: nothing restores -> the whole subtree stays unpainted. -->
      <div class="col">
        <div class="cap">visibility: hidden, no restore</div>
        <div class="vis-host">
          <div class="vis-mid"></div>
        </div>
      </div>

      <!-- 3: yellow box + blue border paint, the red fill inside does not,
           not even with visibility:visible on it. -->
      <div class="col">
        <div class="cap">content-visibility: hidden</div>
        <div class="cv-box cv-hidden">
          <div class="cv-fill" style="visibility: visible"></div>
        </div>
      </div>

      <!-- 4: control. auto only skips offscreen contents, so everything paints. -->
      <div class="col">
        <div class="cap">content-visibility: auto</div>
        <div class="cv-box cv-auto">
          <div class="cv-fill"></div>
        </div>
      </div>
    </div>
  </body>
</html>
